# Template Security Configuration
# This file configures the security policy generation settings

# Organization information
organization: "MyCompany"
contact_email: "security@mycompany.com"

# Policy type: github or enterprise
type: "github"

# Output directory for generated SECURITY.md
output_dir: "."

# Template directory (if using custom templates)
template_dir: "templates"

# Default version for new policies
default_version: "1.0.0"

# Number of years of support for latest version
support_years: 1

# Additional template variables
variables:
  SUPPORT_HOURS: "business hours (9am-5pm UTC)"
  BUG_BOUNTY_URL: "https://hackerone.com/mycompany"
  SECURITY_BLOG: "https://blog.mycompany.com/security"
  SEVERITY_LEVELS: "Critical, High, Medium, Low"