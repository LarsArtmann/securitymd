version: "2"
run:
  timeout: 5m
  go: 1.26.7
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - depguard
    - noinlineerr
  settings:
    cyclop:
      max-complexity: 15
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct_v5:
      ignore-patterns:
        - ^github\.com/LarsArtmann/securitymd/pkg/policy\.GenerateResult$
        - ^github\.com/LarsArtmann/securitymd/pkg/policy\.GenerateOptions$
        - ^github\.com/LarsArtmann/securitymd/pkg/policy\.RepoIdentity$
        - ^github\.com/larsartmann/go-finding/toolsdk\.Spec$
    forbidigo:
      allow:
        - fmt\.(F)?Print(ln)?$
        - fmt\.Fprintf$
        - ^os\.Stderr$
        - ^os\.Stdout$
    funlen:
      lines: 80
      statements: 70
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gochecknoglobals:
      checks:
        - startingWithUnderscore
        - type:*service*func
    gochecknoinits: true
    gocognit:
      min-complexity: 40
    goconst:
      ignore-tests: true
      min-len: 4
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 20
    godot:
      scope: fields
    gomoddirectives:
      replace-local: true
    goprintffuncname:
      skip-check:
        - ^print(Info|Success|Warning|Error)$
    gosec:
      excludes:
        - G304
        - G115
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "100"
    nestif:
      max-depth: 7
    revive:
      confidence: 0.8
    tagalign:
      align: false
      order:
        - binding
        - json
        - yaml
        - xml
        - toml
        - validate
        - mapstructure
      sort: true
    tagliatelle:
      rules:
        - key: json
          values:
            - camel
    testifylint:
      disable:
        - go-require
      enable-all: true
    testpackage:
      skip-regexp: .*test/
    varnamelen:
      ignore-channel-receive: true
      ignore-declared-const: true
      ignore-map-index: true
      ignore-type-asserts: true
      min-length: 3
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
  exclusions:
    generated: lax
    rules:
      - path: ^cmd/
        text: .
        linters:
          - gochecknoglobals
      - path: ^cmd/
        linters:
          - forbidigo
      - path: ^cmd/
        linters:
          - exhaustruct
      - path: test/
        linters:
          - exhaustruct
      - path: test/
        linters:
          - godoclint
      - path: test/
        linters:
          - paralleltest
      - path: test/
        linters:
          - usetesting
      - path: test/
        linters:
          - funlen
      - path: ^cmd/
        text: .
        linters:
          - gocognit
      - path: test/
        text: .
        linters:
          - mnd
      - path: test/
        text: G304|G301|G306
        linters:
          - gosec
      - path: ^test/
        text: package-comments
        linters:
          - revive
      - path: ^cmd/
        text: .
        linters:
          - noinlineerr
      - path: test/
        text: .
        linters:
          - noinlineerr
      - path: ^cmd/
        text: .
        linters:
          - nlreturn
      - path: test/
        text: .
        linters:
          - nlreturn
      - path: test/
        text: .
        linters:
          - copyloopvar
      - path: test/
        text: .
        linters:
          - varnamelen
      - path: ^cmd/
        text: .
        linters:
          - varnamelen
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
          - forcetypeassert
          - gosec
          - errcheck
          - wrapcheck
          - ireturn
          - recvcheck
          - contextcheck
          - exhaustive
          - exhaustruct_v5
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - ^cmd/
      - _templ\.go$
      - test/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
