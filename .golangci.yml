version: "2"
run:
    timeout: 5m
    go: 1.26.2
    build-tags:
        - goexperiment.arenas
        - goexperiment.goroutineleakprofile
        - goexperiment.jsonv2
        - goexperiment.runtimesecret
        - goexperiment.simd
    modules-download-mode: readonly
    allow-parallel-runners: true
    allow-serial-runners: true
    issues-exit-code: 1
    tests: true
output:
    formats: {}
linters:
    enable:
        - arangolint
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        - err113
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - exptostd
        - fatcontext
        - forbidigo
        - forcetypeassert
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godoclint
        - godot
        - godox
        - goheader
        - gomoddirectives
        - gomodguard_v2
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        - interfacebloat
        - intrange
        - iotamixing
        - ireturn
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - mnd
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - noinlineerr
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testifylint
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        - varnamelen
        - wastedassign
        - whitespace
        - wrapcheck
        - wsl_v5
        - zerologlint
    settings:
        cyclop:
            max-complexity: 15
        exhaustruct:
            exclude:
                - ^cmd/template-security/
                - ^internal/security_validator\.go$
                - ^internal/security_tool\.go$
        forbidigo:
            allow:
                - fmt\.(F)?Print(ln)?$
                - fmt\.Fprintf$
                - ^os\.Stderr$
                - ^os\.Stdout$
        funlen:
            lines: 80
            statements: 70
        gochecknoglobals:
            checks:
                - startingWithUnderscore
                - type:*service*func
        gochecknoinits: true
        gocognit:
            min-complexity: 40
        gocritic:
            disabled-checks:
                - dupImport
                - ifElseChain
                - octalLiteral
                - whyNoLint
        godot:
            scope: fields
        goprintffuncname:
            skip-check:
                - ^print(Info|Success|Warning|Error)$
        ireturn:
            allow:
                - error
                - empty
                - anon
                - stdlib
                - generic
        nestif:
            max-depth: 7
        revive:
            confidence: 0.8
        tagliatelle:
            rules:
                - key: json
                  values:
                    - camel
        testpackage:
            skip-regexp: .*test/
        varnamelen:
            ignore-channel-receive: true
            ignore-declared-const: true
            ignore-map-index: true
            ignore-type-asserts: true
            min-length: 3
    exclusions:
        generated: lax
        rules:
            - path: ^cmd/
              text: .
              linters:
                - gochecknoglobals
            - path: ^cmd/
              linters:
                - forbidigo
            - path: ^internal/security_validator\.go$
              linters:
                - forbidigo
            - path: ^internal/security_tool\.go$
              linters:
                - forbidigo
            - path: ^cmd/
              linters:
                - exhaustruct
            - path: test/
              linters:
                - exhaustruct
            - path: test/
              linters:
                - godoclint
            - path: test/
              linters:
                - paralleltest
            - path: test/
              linters:
                - usetesting
            - path: test/
              linters:
                - funlen
            - path: ^internal/
              text: .
              linters:
                - funlen
            - path: ^cmd/
              text: .
              linters:
                - gocognit
            - path: ^internal/
              text: .
              linters:
                - gocognit
            - path: ^internal/
              text: .
              linters:
                - nestif
            - path: ^internal/
              text: .
              linters:
                - mnd
            - path: test/
              text: .
              linters:
                - mnd
            - path: test/
              text: G304|G301|G306
              linters:
                - gosec
            - path: ^internal/security_validator\.go$
              text: G304
              linters:
                - gosec
            - path: ^internal/project_detector\.go$
              text: G304
              linters:
                - gosec
            - path: ^internal/
              text: package-comments
              linters:
                - revive
            - path: ^test/
              text: package-comments
              linters:
                - revive
            - path: ^cmd/
              text: .
              linters:
                - noinlineerr
            - path: ^internal/
              text: .
              linters:
                - noinlineerr
            - path: test/
              text: .
              linters:
                - noinlineerr
            - path: ^cmd/
              text: .
              linters:
                - nlreturn
            - path: ^internal/
              text: .
              linters:
                - nlreturn
            - path: test/
              text: .
              linters:
                - nlreturn
            - path: ^internal/
              text: .
              linters:
                - copyloopvar
            - path: test/
              text: .
              linters:
                - copyloopvar
            - path: test/
              text: .
              linters:
                - varnamelen
            - path: ^cmd/
              text: .
              linters:
                - varnamelen
        paths:
            - ^cmd/
            - ^internal/
            - test/
formatters:
    enable:
        - gci
        - goimports
        - gofumpt
        - golines
    exclusions:
        generated: lax
issues: {}
