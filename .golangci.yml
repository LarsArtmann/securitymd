version: "2"
run:
    timeout: 5m
    go: "1.25"
    build-tags: []
    modules-download-mode: readonly
    allow-parallel-runners: true
    allow-serial-runners: false
    issues-exit-code: 1
    tests: true
output:
    formats: {}
linters:
    enable:
        - misspell
        - maintidx
        - gosmopolitan
        - contextcheck
        - inamedparam
        - interfacebloat
        - godox
        - unqueryvet
        - nonamedreturns
        - nilerr
        - unconvert
        - goprintffuncname
        - decorder
        - embeddedstructfieldcheck
        - dupword
        - revive
        - gocritic
        - makezero
        - mnd
        - staticcheck
        - godoclint
        - depguard
        - funcorder
        - nosprintfhostport
        - govet
        - unused
        - gochecknoinits
        - exhaustive
        - thelper
        - rowserrcheck
        - funlen
        - forcetypeassert
        - dogsled
        - noinlineerr
        - testableexamples
        - intrange
        - zerologlint
        - tparallel
        - exhaustruct
        - unparam
        - iotamixing
        - ginkgolinter
        - nakedret
        - usetesting
        - whitespace
        - wastedassign
        - nilnil
        - lll
        - testpackage
        - gomoddirectives
        - mirror
        - spancheck
        - modernize
        - canonicalheader
        - ineffassign
        - errorlint
        - gosec
        - cyclop
        - ireturn
        - arangolint
        - asasalint
        - gochecknoglobals
        - prealloc
        - fatcontext
        - copyloopvar
        - err113
        - gochecksumtype
        - nestif
        - bidichk
        - sloglint
        - asciicheck
        - usestdlibvars
        - nlreturn
        - forbidigo
        - iface
        - predeclared
        - loggercheck
        - nilnesserr
        - promlinter
        - nolintlint
        - testifylint
        - reassign
        - sqlclosecheck
        - gocheckcompilerdirectives
        - protogetter
        - perfsprint
        - paralleltest
        - bodyclose
        - gocyclo
        - varnamelen
        - tagalign
        - errname
        - exptostd
        - containedctx
        - gomodguard
        - noctx
        - goconst
        - importas
        - dupl
        - tagliatelle
        - grouper
        - godot
        - errcheck
        - recvcheck
        - goheader
        - durationcheck
        - gocognit
        - wsl_v5
        - wrapcheck
formatters:
    enable:
        - golines
issues: {}
