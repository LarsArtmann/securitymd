version: "2"

run:
  timeout: 5m
  go: 1.26.1
  build-tags:
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.simd
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true

output:
  formats: {}

linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - funcorder
    - depguard

formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines

linters-settings:
  forbidigo:
    allow:
      - fmt\.(F)?Print(ln)?$
      - fmt\.Fprintf$
      - ^os\.Stderr$
      - ^os\.Stdout$

  gochecknoglobals:
    checks:
      - startingWithUnderscore
      - type:*service*func

  exhaustruct:
    exclude:
      - files:
          - "cmd/template-security/*.go"
          - "internal/security_validator.go"
          - "internal/security_tool.go"

  goprintffuncname:
    skip-check:
      - ^print(Info|Success|Warning|Error)$

  revive:
    confidence: 0.8
    rules:
      - name: exported
        arguments:
          - disabledIfCommentBased
      - name: package-comments
        arguments:
          - period

  cyclop:
    max-complexity: 14

  gocognit:
    min-complexity: 40

  nestif:
    max-depth: 7

  varnamelen:
    min-length: 3
    ignore-type-asserts: true
    ignore-map-index: true
    ignore-channel-receive: true
    ignore-declared-const: true

  tagliatelle:
    rules:
      - key: json
        values: [camel]

  paralleltest:
    ignore-file: test/acceptance/

  funlen:
    lines: 80
    statements: 70

  gosec:
    excludes:
      - G104

  gochecknoinits: true

  testpackage:
    skip-regexp: (acceptance|internal_test)$

issues:
  exclude-rules:
    - linters:
        - testpackage
      text: "package should be"
    - linters:
        - gochecknoglobals
      path: "cmd/template-security/"
    - linters:
        - exhaustruct
      path: "cmd/template-security/"
    - linters:
        - gocognit
      path: "cmd/template-security/"
    - linters:
        - funlen
      path: "cmd/template-security/"
    - linters:
        - cyclop
      path: "cmd/template-security/"
    - linters:
        - exhaustruct
      path: "internal/"
    - linters:
        - forbidigo
      path: "internal/"
