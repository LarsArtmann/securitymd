version: "2"
run:
  timeout: 5m
  go: 1.26.1
  build-tags:
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.simd
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - funcorder
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
linters-settings:
  depguard:
    rules:
      Main:
        allow:
          - $gostd
          - github.com/fatih/color
          - github.com/spf13/cobra
          - github.com/spf13/pflag
          - github.com/spf13/viper
          - github.com/larsartmann/go-finding
          - github.com/larsartmann/go-finding/pipeline
          - github.com/LarsArtmann/template-SECURITY/internal
          - github.com/LarsArtmann/template-SECURITY/internal/types
      Test:
        allow:
          - $gostd
          - github.com/fatih/color
          - github.com/spf13/cobra
          - github.com/spf13/pflag
          - github.com/larsartmann/go-finding
          - github.com/larsartmann/go-finding/pipeline
          - github.com/LarsArtmann/template-SECURITY/internal
          - github.com/LarsArtmann/template-SECURITY/internal/types
          - github.com/onsi/ginkgo/v2
          - github.com/onsi/gomega
          - github.com/stretchr/testify
  forbidigo:
    allow:
      - ^fmt\.Fprint
      - ^fmt\.Fprintf
      - ^fmt\.Fprintln
  gocognit:
    min-complexity: 30
  nestif:
    max-depth: 5
  varnamelen:
    min-length: 2
  funlen:
    lines: 80
    statements: 60
issues: {}
